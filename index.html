<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORALE 3.1 WINTER ❄️</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:linear-gradient(135deg,#020b1c,#092747,#164b70);
 color:white;
 font-family:Arial;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:15px;
 overflow-x:hidden;
 position:relative;
}

.snow{
 position:fixed;
 top:-20px;
 color:white;
 pointer-events:none;
 z-index:0;
 animation:fall linear infinite;
 opacity:.8;
}

@keyframes fall{
 to{transform:translateY(110vh) rotate(360deg)}
}

.app{
 position:relative;
 z-index:1;
 width:100%;
 max-width:650px;
 background:rgba(10,35,61,.88);
 backdrop-filter:blur(15px);
 border:1px solid #55cfff;
 border-radius:22px;
 padding:20px;
 box-shadow:0 0 35px #00bfff35;
}

h1{
 text-align:center;
 color:#8ee8ff;
 text-shadow:0 0 15px #00bfff;
}

.sub{text-align:center;color:#b9eaff}

.robot{
 text-align:center;
 font-size:65px;
 margin:15px;
 filter:drop-shadow(0 0 12px #65dfff);
}

.status{
 text-align:center;
 color:#8df5d0;
 font-size:13px;
}

#chat{
 height:340px;
 overflow-y:auto;
 background:rgba(1,15,31,.8);
 border:1px solid #28648a;
 padding:12px;
 border-radius:14px;
 margin:18px 0;
}

.msg{
 padding:12px;
 margin:9px 0;
 border-radius:12px;
 max-width:90%;
 line-height:1.6;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}

.user{
 background:linear-gradient(135deg,#087ca8,#075985);
 margin-right:auto;
}

.bot{
 background:linear-gradient(135deg,#1c3c59,#254d6d);
 margin-left:auto;
 border:1px solid #3d789d;
}

.controls,.keybox{
 display:flex;
 gap:8px;
 margin-top:10px;
}

input{
 min-width:0;
 flex:1;
 padding:13px;
 border:1px solid #6acfff;
 border-radius:10px;
 font-size:15px;
 background:#eaf8ff;
 color:#08243b;
}

button{
 border:1px solid #8ce5ff;
 border-radius:10px;
 padding:12px 16px;
 background:linear-gradient(135deg,#159dcc,#0875ad);
 color:white;
 font-size:15px;
 cursor:pointer;
 box-shadow:0 0 12px #00bfff35;
}

button:hover{
 background:linear-gradient(135deg,#43d5ff,#0875ad);
}

button:disabled{opacity:.5;cursor:wait}

.note{
 font-size:12px;
 color:#b9d9ed;
 line-height:1.6;
}
</style>
</head>

<body>

<div class="app">
 <h1>🤖 ORALE 3.1 ❄️</h1>
 <div class="sub">Winter Edition • Your Personal AI Assistant</div>

 <div class="robot">🤖❄️</div>

 <div class="status" id="status">● جاهز للمحادثة</div>

 <div id="chat">
  <div class="msg bot">
   ❄️ مرحبًا! أنا ORALE في نسختي الشتوية.
   كيف يمكنني مساعدتك اليوم؟ ☃️
  </div>
 </div>

 <div class="controls">
  <input id="message" placeholder="اكتب رسالتك هنا...">
  <button id="send">إرسال ❄️</button>
 </div>

 <div class="keybox">
  <input id="apiKey" type="password" placeholder="مفتاح Gemini API">
  <button id="showKey">إظهار</button>
 </div>

 <p class="note">
  ❄️ ORALE WINTER EDITION.
  لا تنشر مفتاح API داخل صفحة عامة.
 </p>
</div>

<script>
/* تأثير الثلوج */
for(let i=0;i<35;i++){
 const snow=document.createElement("div");
 snow.className="snow";
 snow.textContent="❄";
 snow.style.left=Math.random()*100+"%";
 snow.style.animationDuration=(5+Math.random()*10)+"s";
 snow.style.animationDelay=Math.random()*10+"s";
 snow.style.fontSize=(10+Math.random()*15)+"px";
 document.body.appendChild(snow);
}

const MODELS = [
 "gemini-3.6-flash",
 "gemini-3.5-flash-lite"
];

const chat = document.getElementById("chat");
const messageInput = document.getElementById("message");
const keyInput = document.getElementById("apiKey");
const sendButton = document.getElementById("send");
const statusText = document.getElementById("status");

let history = [];
let busy = false;

function addMessage(text, type) {
 const div = document.createElement("div");
 div.className = "msg " + type;
 div.textContent = text;
 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
 return div;
}

document.getElementById("showKey").onclick = () => {
 keyInput.type = keyInput.type === "password" ? "text" : "password";
};

async function askGemini(model, key, message) {
 const controller = new AbortController();
 const timer = setTimeout(() => controller.abort(), 40000);

 try {
  const response = await fetch(
   `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
   {
    method: "POST",
    headers: {
     "Content-Type": "application/json",
     "x-goog-api-key": key
    },
    body: JSON.stringify({
     systemInstruction: {
      parts: [{
       text: "أنت ORALE، مساعد ذكي وودود. أجب بوضوح وباللغة التي يستعملها المستخدم."
      }]
     },
     contents: [
      ...history,
      {role:"user",parts:[{text:message}]}
     ],
     generationConfig: {
      temperature:0.7,
      maxOutputTokens:700
     }
    }),
    signal: controller.signal
   }
  );

  const data = await response.json();

  if (!response.ok) {
   const error = new Error(
    data.error?.message || "HTTP " + response.status
   );
   error.status = response.status;
   throw error;
  }

  const answer = data.candidates?.[0]?.content?.parts
   ?.map(p => p.text || "").join("");

  if (!answer) throw new Error("لم يصل رد نصي من النموذج.");

  return answer;
 } finally {
  clearTimeout(timer);
 }
}

async function sendMessage() {
 if (busy) return;

 const message = messageInput.value.trim();
 const key = keyInput.value.trim();

 if (!message) return;

 if (!key) {
  addMessage("ضع مفتاح Gemini في الخانة أولًا.", "bot");
  return;
 }

 addMessage(message, "user");
 messageInput.value = "";
 busy = true;
 sendButton.disabled = true;

 const loading = addMessage("جاري التفكير... ❄️", "bot");
 statusText.textContent = "● جاري الاتصال بـ Gemini";

 try {
  let answer = "";
  let lastError = null;

  for (const model of MODELS) {
   try {
    statusText.textContent = "● تجربة " + model;
    answer = await askGemini(model, key, message);
    break;
   } catch (error) {
    lastError = error;

    if (![404,429,500,502,503,504].includes(error.status)
        && error.name !== "AbortError") {
     throw error;
    }
   }
  }

  if (!answer) throw lastError || new Error("تعذر الاتصال.");

  loading.remove();
  addMessage(answer, "bot");

  history.push(
   {role:"user",parts:[{text:message}]},
   {role:"model",parts:[{text:answer}]}
  );

  if (history.length > 12) history = history.slice(-12);

  statusText.textContent = "● ORALE متصل ❄️";

 } catch (error) {
  loading.remove();

  let explanation = error.message;

  if (error.name === "AbortError") {
   explanation = "انتهت مهلة الانتظار. حاول مرة أخرى.";
  }

  addMessage("تعذر الاتصال: " + explanation, "bot");
  statusText.textContent = "● لم يكتمل الاتصال";
 } finally {
  busy = false;
  sendButton.disabled = false;
  messageInput.focus();
 }
}

sendButton.addEventListener("click", sendMessage);

messageInput.addEventListener("keydown", event => {
 if (event.key === "Enter") sendMessage();
});
</script>

</body>
</html>
